name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same version .tool-versions pins locally via asdf.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Run tests
        run: cargo test
