name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruby:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Reads the Ruby version from the repo-root .tool-versions.
      - uses: ruby/setup-ruby@v1
      - name: Run tests
        run: rake test
      - name: Build the mruby executable
        run: rake build
      - name: Compare every example through the executable
        run: YARA_BINARY=build/yara rake test TEST=test/parity_test.rb
      - uses: actions/upload-artifact@v4
        with:
          name: yara-${{ runner.os }}-${{ runner.arch }}
          path: build/yara

  mruby-standalone:
    needs: ruby
    runs-on: ubuntu-latest
    # A bare image with no Ruby, so the executable has to stand alone.
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: yara-Linux-X64
          path: build
      - name: Compare every example with the expected output
        run: |
          if command -v ruby; then echo "Ruby is installed; this job must run without it"; exit 1; fi
          chmod +x build/yara
          script/parity.sh build/yara
